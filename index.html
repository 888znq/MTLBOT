<style>

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;background:#000432;color:var(--pf-text);font-family:'Roboto Mono',monospace;overflow:hidden;user-select:none;-webkit-user-select:none;}

#tcBar,.ctrl-row,.table-hdr{display:none;}
#canvas-viewport,#wall-finder-pane{background:var(--pf-bg);border:1px solid var(--pf-line);border-radius:8px;}

.tcRow{display:flex;align-items:center;gap:10px;padding:4px 12px;border-radius:8px;background:var(--pf-fill);border:1px solid var(--pf-line2);color:var(--pf-text);font-weight:600;white-space:nowrap;}

#tradePill #scanIntv{order:4;}
#tradePill #tpAmt{order:5;}
#tradePill #tpBuy{order:6;}
#tradePill #tpSell{order:7;}
#tradePill #tpAuto{order:8;}
#tradePill #tpBal{order:9;}

#tradePill #modeBtn{order:11;}

  if (window.dvTrades.length > 20) window.dvTrades.shift();
  try { if (dv.ws && dv.ready) dv.ws.send(JSON.stringify({ proposal_open_contract: 1, contract_id: b.contract_id, subscribe: 1 })); } catch (e) {}
};
window.dvOnPoc = function (p) {
  var L = window.dvTrades;
  for (var i = 0; i < L.length; i++) {
    if (L[i].id !== String(p.contract_id)) continue;
    var tr = L[i], en = +p.entry_spot || +p.entry_tick || 0;
    if (en) tr.entry = en;
    if (+p.date_start) tr.t0 = +p.date_start;
    if (+p.date_expiry) tr.exp = +p.date_expiry;
    if (+p.payout) tr.payout = +p.payout;
    if (p.profit !== undefined && p.profit !== null) tr.pnl = +p.profit;
    if (p.is_sold || p.status === "won" || p.status === "lost") tr.status = (p.status === "won" || +p.profit > 0) ? "won" : "lost";
  }
};

function _scanPairNow(p) {
  if (_scanQ.indexOf(p) < 0) { if (_gmVis(p)) _scanQ.unshift(p); else _scanQ.push(p); }
  if (scanPending) return;
  var a = parseInt(document.getElementById("scanMin").value, 10) || 300, b = parseInt(document.getElementById("scanMax").value, 10) || 300;
  window._scanMin = Math.min(a, b); window._scanMax = Math.max(a, b); window._ssJob = null;
  scanPending = 1; _scanStartedAt = Date.now();
  if (!_scanNext()) scanPending = 0;
}
function _loadRest(ctx) {
  var rest = ALL_PAIRS.filter(function (p) { return activePairs.indexOf(p) < 0; });
  var q = rest.filter(function (p) { return /^1HZ/.test(p); }).concat(
    rest.filter(function (p) { return _gmPairs("MTL").indexOf(p) >= 0; }),
    rest.filter(function (p) { return /^frx/.test(p) && _gmPairs("MTL").indexOf(p) < 0; }),
        rest.filter(function (p) { return /^cry/.test(p); })
      );
  rest.forEach(function (p) {
    activePairs.push(p);
    allPairData[p] = { times: new Int32Array(0), prices: new Float64Array(0) };
  });
  _gmUi();
  window._loadQ = q;
  var run = async function () {
    var p, g, j;
    while (q.length) {
      p = q.shift();
      if (ctx.startTsUtc !== currentStartTsUtc) return;
      _bootPairState[p] = "wait";
      try { g = await fetchDerivGrid(p, ctx.startTsUtc, ctx.startTsUtc + ctx.duration); } catch (e) { continue; }
      if (ctx.startTsUtc !== currentStartTsUtc || activePairs.indexOf(p) < 0) return;
      allPairData[p] = g;
      for (j = g.prices.length - 1; j > 0 && g.prices[j] === -1; j--);
      window._lmx[p] = j > 0 ? j : 0;
      _bootPairState[p] = "done";
      _scanPairNow(p);
      _gmUi();
    }
  };
  for (var w = 0; w < 5; w++) run();
}
window.onload = async function () {
  await _fbP;
  _fbApply();
  activePairs = _gmPairs(_gmList[_gmCur]);
  DV_SYM = activePairs[0];
  _gmUi();
  var ctx = getTradingContext();
  currentStartTsUtc = ctx.startTsUtc;
  bootLog("AOFS LOCAL BOOT — " + ctx.dateStr + " (05:30-05:30 IST)");
  _cacheClean(ctx.startTsUtc);
  await _loadPairs(ctx);
  document.getElementById("syncStatusText").textContent = ctx.isLive ? "🟢 LIVE SYNCED" : "🔵 MARKET CLOSED";
  window._autoSelectAfterScan = true;
  processVisualMatrix();
  dispatchMultiCycleScan();
  var _vis = activePairs.slice();
    _loadRest(ctx);
    await new Promise(function (res) {
      var t0 = Date.now(), iv = setInterval(function () {
        var ready = _vis.every(function (p) { return _pairRes[p]; });
        if (ready || Date.now() - t0 > 25000 || ctx.startTsUtc !== currentStartTsUtc) { clearInterval(iv); res(); }
      }, 300);
    });
  var o = document.getElementById("bootOverlay"); if (o) o.style.display = "none";
};
</script>

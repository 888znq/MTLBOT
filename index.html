<body style="margin:0;background:#000;font:12px monospace">
<div style="overflow-x:auto;height:100vh"><canvas id=c style="display:block"></canvas></div>
<canvas id=a style="position:fixed;right:0;top:0;pointer-events:none"></canvas>
<script>
const N=1440,S=4,H=innerHeight-20,x=c.getContext('2d'),y=a.getContext('2d'),g=s=>fetch('https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1m&limit=720&startTime='+s).then(r=>r.json());
var t=new Date(),d,lo,hi,Y,X,h,i,v;
c.width=N*S;c.height=a.height=H;a.width=70;y.font='12px monospace';
t.setHours(5,30,0,0);if(t>Date.now())t.setDate(t.getDate()-1);t=+t;
Promise.all([g(t),g(t+43200000)]).then(r=>{
d=r.flat().map(k=>+k[4]);lo=Math.min(...d);hi=Math.max(...d);
Y=v=>H-30-(v-lo)/(hi-lo)*(H-60);
x.fillStyle='#222';y.fillStyle='#fff';y.textAlign='right';
for(i=0;i<=4;i++){v=lo+(hi-lo)*i/4;x.fillRect(0,Y(v),N*S,1);y.fillText(v.toFixed(2),66,Y(v)-3)}
x.strokeStyle='#0f0';x.beginPath();
d.forEach((v,i)=>x[i?'lineTo':'moveTo'](i*S,Y(v)));x.stroke();
x.fillStyle='#555';
for(h=0;h<=24;h++){X=Math.min(h*60*S,N*S-1);x.fillRect(X,0,1,H);x.textAlign=h>23?'right':'left';x.fillText(String((5+h)%24).padStart(2,0)+':30',X+3,H-10)}
});
</script>
</body>

<style>
:root{--bg-base:#000432;--bg-panel:#000432;--accent-green:#2ED573;--accent-red:#E63946;--text-primary:#E2E8F0;--border:#E2E8F0;--pair-color:hsl(253,80%,60%);}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;background:var(--bg-base);color:var(--text-primary);font-family:'JetBrains Mono',monospace;overflow:hidden;user-select:none;-webkit-user-select:none;}
#main-container{height:100%;display:grid;grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) clamp(175px,30vh,290px);overflow:hidden;position:relative;}
body.tc-solo #main-container{grid-template-rows:1fr 0px;}
body.tc-solo #wall-finder-pane{display:none!important;}
#canvas-viewport{grid-column:1;grid-row:1;position:relative;overflow:hidden;background:var(--bg-base);touch-action:none;}
#tcWrap{position:absolute;inset:0;z-index:6;background:var(--bg-base);touch-action:none;overflow:hidden;}
#tcCanvas{display:block;position:absolute;top:0;left:0;touch-action:none;}
#tcBar{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);display:flex;gap:2px;z-index:3;background:#000432;padding:2px;border:1px solid var(--pair-color);border-radius:999px;}
#tcBar button{background:var(--pair-color);color:#000432;border:none;border-radius:999px;font:800 10px 'JetBrains Mono',monospace;padding:4px 10px;cursor:pointer;height:24px;}
#tcBar button.tcOn{background:#FFD700;color:#000432;}
#scanChartTimer{position:fixed;right:24px;top:22px;width:160px;height:100px;display:flex;align-items:center;justify-content:center;z-index:20;pointer-events:none;opacity:.22;font:800 84px/1 'JetBrains Mono',monospace;color:var(--pair-color);}
#wall-finder-pane{grid-column:1;grid-row:2;border-top:1px solid var(--pair-color);background:var(--bg-base);display:flex;flex-direction:column;overflow:hidden;z-index:10;}
.ctrl-row{display:flex;align-items:center;gap:4px;padding:3px 6px;background:var(--bg-panel);border-bottom:1px solid #1e293b;flex-shrink:0;}
.ctrl-input,.ctrl-btn{background:var(--pair-color);color:#000432;border:1px solid #000432;border-radius:999px;font:800 10px 'JetBrains Mono',monospace;height:22px;padding:0 8px;outline:none;text-align:center;cursor:pointer;}
.ctrl-btn.on{background:var(--accent-green);color:#000432;}
.tables-split{display:flex;flex:1;min-height:0;overflow:hidden;gap:2px;}
.table-col{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;}
.table-hdr{font-size:9px;font-weight:800;letter-spacing:.25em;color:#000432;background:var(--pair-color);padding:3px 8px;text-align:center;flex-shrink:0;cursor:pointer;}
.table-wrapper{flex:1;overflow-y:auto;scrollbar-width:none;}
.table-wrapper::-webkit-scrollbar{display:none;}
table{width:100%;border-collapse:separate;border-spacing:0 1px;table-layout:fixed;font-size:11px;}
td{padding:6px 3px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:clip;color:#000432;border-right:1px solid #000432;}
td:last-child{border-right:none;}
.row-red td{background:var(--accent-red);}
.row-green td{background:var(--accent-green);}
tr.highlight-gem{cursor:pointer;}
tr.highlight-gem[data-wpe][data-wph="1"]>td:nth-child(4){position:relative;color:transparent!important;}
tr.highlight-gem[data-wpe][data-wph="1"]>td:nth-child(4)::after{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#000432;font-size:10px;font-weight:900;}
tr.highlight-gem[data-wpe="WARN"][data-wph="1"]>td:nth-child(4)::after{content:"HIT SOON";}
tr.highlight-gem[data-wpe="HIT"][data-wph="1"]>td:nth-child(4)::after{content:"HIT";}
tr.highlight-gem[data-wpe="MISS"][data-wph="1"]>td:nth-child(4)::after{content:"MISSED";}
#bootOverlay{position:fixed;inset:0;background:#000432;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;}
#bootLogBox{width:min(540px,94vw);height:150px;background:#070B2E;border:1px solid var(--pair-color);border-radius:14px;padding:10px;overflow-y:auto;font-size:10px;line-height:1.5;}
#tcBar,.ctrl-row,.table-hdr{display:none!important;}
html,body{background:#00021c;}
#main-container{padding:8px;gap:8px;}
body.tc-solo #main-container{gap:0;}

table{border-spacing:0;font-variant-numeric:tabular-nums;}
td{height:36px;padding:3px 4px;vertical-align:middle;border-right:1px solid rgba(0,4,50,.55);border-bottom:1px solid rgba(0,4,50,.9);}
tr:last-child td{border-bottom:none;}

:root{color-scheme:dark;--pf-bg:#0B0E11;--pf-bg2:#0D1117;--pf-ctl:#141A22;--pf-line:#232A33;--pf-line2:#2F3845;--pf-text:#EAECEF;--pf-soft:#C5CBD6;--pf-mute:#848E9C;--pf-up:#0ECB81;--pf-dn:#F6465D;--pf-gold:#FCD535;--pf-up-rgb:14,203,129;--pf-dn-rgb:246,70,93;}

#canvas-viewport,#wall-finder-pane{background:var(--pf-bg);border:1px solid var(--pf-line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.03);}
